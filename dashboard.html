<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Dashboard - ScanSwaad</title>
  <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-[#0f172a] text-white min-h-screen px-6 md:px-16 py-8 font-sans">

  <!-- Header -->
  <header class="flex justify-between items-center mb-10">
    <h1 class="text-2xl md:text-3xl font-extrabold tracking-wide">
      Welcome, <span class="text-cyan-400" id="restaurantName">Restaurant</span> 👋
    </h1>
    <a href="index.html" class="px-5 py-2 rounded-md border border-gray-700 text-sm text-white hover:bg-pink-500 transition duration-300">
      Logout
    </a>
  </header>

  <!-- Summary Cards -->
  <section class="grid grid-cols-1 sm:grid-cols-2 md:grid-cols-4 gap-6 mb-12">
    <div class="bg-white/5 rounded-xl p-6 shadow-lg border border-pink-500/20 hover:shadow-pink-500/30 transition">
      <h3 class="text-lg font-semibold text-white mb-1">Menu Items</h3>
      <p class="text-3xl font-bold text-pink-400" id="menuCount">0</p>
    </div>
    <div class="bg-white/5 rounded-xl p-6 shadow-lg border border-cyan-400/20 hover:shadow-cyan-400/30 transition">
      <h3 class="text-lg font-semibold text-white mb-1">QR Codes</h3>
      <p class="text-3xl font-bold text-cyan-400" id="qrCount">0</p>
    </div>
    <div class="bg-white/5 rounded-xl p-6 shadow-lg border border-indigo-400/20 hover:shadow-indigo-400/30 transition">
      <h3 class="text-lg font-semibold text-white mb-1">Menu Views</h3>
      <p class="text-3xl font-bold text-indigo-300" id="menuViews">0</p>
    </div>
    <div class="bg-white/5 rounded-xl p-6 shadow-lg border border-emerald-400/20 hover:shadow-emerald-400/30 transition">
      <h3 class="text-lg font-semibold text-white mb-1">Rating</h3>
      <p class="text-3xl font-bold text-emerald-300" id="rating">4.8 ⭐</p>
    </div>
  </section>

  <!-- Step 2: Digital Menu Manager -->
  <section class="bg-white/5 p-6 rounded-xl shadow-lg border border-gray-700 mb-12">
    <div class="flex justify-between items-center mb-6">
      <h2 class="text-2xl font-bold">Menu Manager</h2>
      <button onclick="document.getElementById('modal').classList.remove('hidden')" class="bg-gradient-to-r from-pink-500 to-cyan-400 px-4 py-2 rounded-md text-white hover:scale-105 transition">+ Add New Item</button>
    </div>

    <!-- Table -->
    <div class="overflow-auto rounded-xl">
      <table class="w-full table-auto text-left min-w-[600px]">
        <thead>
          <tr class="bg-[#1e293b] text-sm text-cyan-300">
            <th class="py-3 px-4">Item Name</th>
            <th class="py-3 px-4">Category</th>
            <th class="py-3 px-4">Price (₹)</th>
            <th class="py-3 px-4">Available</th>
            <th class="py-3 px-4">Actions</th>
          </tr>
        </thead>
        <tbody id="menuTable" class="text-sm text-gray-300">
          <tr><td colspan="5" class="text-center py-6">Loading...</td></tr>
        </tbody>
      </table>
    </div>
  </section>

  <!-- Modal: Add New Item -->
  <div id="modal" class="hidden fixed inset-0 bg-black/60 flex items-center justify-center z-50">
    <div class="bg-[#1E293B] p-6 rounded-xl w-full max-w-lg space-y-4 shadow-lg border border-cyan-400">
      <h3 class="text-xl font-bold text-white mb-2">Add New Menu Item</h3>
      <input type="text" id="itemName" placeholder="Item Name" class="w-full p-3 rounded-md bg-gray-800 border border-gray-600 text-white">
      <select id="itemCategory" class="w-full p-3 rounded-md bg-gray-800 border border-gray-600 text-white">
        <option disabled selected>Select Category</option>
      </select>
      <input type="number" id="itemPrice" placeholder="Price in ₹" class="w-full p-3 rounded-md bg-gray-800 border border-gray-600 text-white">
      <input type="file" id="itemImage" class="w-full text-white">
      <div class="flex justify-end space-x-3 pt-4">
        <button onclick="document.getElementById('modal').classList.add('hidden')" class="px-4 py-2 border border-gray-600 text-white rounded-md hover:bg-gray-700">Cancel</button>
        <button onclick="addItem()" class="px-5 py-2 bg-gradient-to-r from-pink-500 to-cyan-400 text-white rounded-md hover:scale-105 transition">Save</button>
      </div>
    </div>
  </div>

  <!-- Firebase SDKs -->
  <script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-app.js"></script>
  <script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-auth.js"></script>
  <script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-firestore.js"></script>
  <script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-storage.js"></script>
  <script src="firebase-config.js"></script>

  <!-- Dynamic Logic -->
  <script>
    const auth = firebase.auth();
    const db = firebase.firestore();
    const storage = firebase.storage();

    async function populateCategories() {
      const dropdown = document.getElementById("itemCategory");
      const snapshot = await db.collection("categories").get();
      snapshot.forEach(doc => {
        const option = document.createElement("option");
        option.value = doc.id;
        option.textContent = doc.data().name;
        dropdown.appendChild(option);
      });
    }

    async function addItem() {
      const user = auth.currentUser;
      if (!user) return alert("You must be logged in");

      const name = document.getElementById("itemName").value;
      const category = document.getElementById("itemCategory").value;
      const price = parseFloat(document.getElementById("itemPrice").value);
      const imageFile = document.getElementById("itemImage").files[0];

      if (!name || !category || !price || !imageFile) return alert("Fill all fields and upload image");

      const storageRef = storage.ref(`menus/${user.uid}/${imageFile.name}`);
      await storageRef.put(imageFile);
      const imageUrl = await storageRef.getDownloadURL();

      await db.collection("menus").add({
        ownerId: user.uid,
        name,
        category,
        price,
        image: imageUrl,
        available: true,
        createdAt: new Date()
      });

      alert("Menu item added!");
      document.getElementById("modal").classList.add("hidden");
      window.location.reload();
    }

    window.onload = async () => {
      auth.onAuthStateChanged(async (user) => {
        if (user) {
          const uid = user.uid;

          const userDoc = await db.collection("users").doc(uid).get();
          const userData = userDoc.data();
          document.getElementById("restaurantName").innerText = userData.restaurant;

          const menuSnap = await db.collection("menus").where("ownerId", "==", uid).get();
          const qrSnap = await db.collection("qrcodes").where("ownerId", "==", uid).get();
          document.getElementById("menuCount").innerText = menuSnap.size;
          document.getElementById("qrCount").innerText = qrSnap.size;
          document.getElementById("menuViews").innerText = Math.floor(Math.random() * 500) + 50;

          const tableBody = document.getElementById("menuTable");
          tableBody.innerHTML = "";
          menuSnap.forEach(doc => {
            const item = doc.data();
            tableBody.innerHTML += `
              <tr class="border-b border-slate-700 hover:bg-slate-800/30">
                <td class="py-3 px-4">${item.name}</td>
                <td class="py-3 px-4">${item.category}</td>
                <td class="py-3 px-4">₹${item.price}</td>
                <td class="py-3 px-4">${item.available ? "✅" : "❌"}</td>
                <td class="py-3 px-4">
                  <button class="text-sm text-blue-400 hover:underline mr-2">Edit</button>
                  <button class="text-sm text-pink-400 hover:underline">Delete</button>
                </td>
              </tr>`;
          });

          await populateCategories();
        } else {
          window.location.href = "login.html";
        }
      });
    };
  </script>
</body>
</html>
