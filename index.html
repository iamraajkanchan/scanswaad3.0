<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>ScanSwaad</title>

  <!-- ✅ Use Tailwind via CDN -->
  <script src="https://cdn.tailwindcss.com"></script>

  <!-- ✅ Extend Tailwind with your custom animations -->
  <script>
    tailwind.config = {
      theme: {
        extend: {
          animation: {
            fadeIn: 'fadeIn 1s ease-out both',
            slideUp: 'slideUp 1s ease-out both',
          },
          keyframes: {
            fadeIn: {
              '0%': { opacity: '0' },
              '100%': { opacity: '1' },
            },
            slideUp: {
              '0%': { transform: 'translateY(30px)', opacity: '0' },
              '100%': { transform: 'translateY(0)', opacity: '1' },
            },
          }
        }
      }
    };
  </script>
</head>

<body class="bg-gray-100 text-gray-900">
  <div id="navbar"></div>
  <div id="homepage"></div>
  <div id="features"></div>
  <div id="howitworks"></div>
  <div id="reviews"></div>
  <div id="upgrade"></div>
  <div id="footer"></div>


  <script>
    async function loadComponent(id, file) {
      const response = await fetch(`./components/${file}`);
      const html = await response.text();
      document.getElementById(id).innerHTML = html;
    }

    loadComponent('navbar', 'navbar.html');
    loadComponent('homepage', 'homepage.html');
    loadComponent('features', 'features.html');
    loadComponent('howitworks', 'howitworks.html');
    loadComponent('reviews', 'reviews.html');
    loadComponent('upgrade', 'upgrade.html');
    loadComponent('footer', 'footer.html');
  </script>
</body>
