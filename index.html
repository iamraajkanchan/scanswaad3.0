<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>ScanSwaad</title>

  <!-- ✅ Tailwind CSS via CDN -->
  <script src="https://cdn.tailwindcss.com"></script>

  <!-- ✅ Custom Tailwind config for animations and colors -->
  <script>
    tailwind.config = {
      theme: {
        extend: {
          colors: {
            scan: '#F87171',     // light red
            swaad: '#4ADE80',    // light green
          },
          animation: {
            fadeIn: 'fadeIn 1s ease-out both',
            slideUp: 'slideUp 1s ease-out both',
          },
          keyframes: {
            fadeIn: {
              '0%': { opacity: '0' },
              '100%': { opacity: '1' },
            },
            slideUp: {
              '0%': { transform: 'translateY(30px)', opacity: '0' },
              '100%': { transform: 'translateY(0)', opacity: '1' },
            },
          }
        }
      }
    };
  </script>
</head>

<body class="bg-gray-100 text-gray-900 font-sans">

  <!-- 📦 Component placeholders -->
  <div id="navbar"></div>
  <div id="homepage"></div>
  <div id="features"></div>
  <div id="howitworks"></div>
  <div id="reviews"></div>
  <div id="upgrade"></div>
  <div id="footer"></div>

  <!-- 🔌 Load HTML components dynamically -->
  <script>
    async function loadComponent(id, file) {
      try {
        const response = await fetch(`./components/${file}`);
        if (!response.ok) throw new Error(`Failed to load ${file}`);
        const html = await response.text();
        document.getElementById(id).innerHTML = html;
      } catch (error) {
        console.error(`Error loading ${file}:`, error);
      }
    }

    loadComponent('navbar', 'navbar.html');
    loadComponent('homepage', 'homepage.html');
    loadComponent('features', 'features.html');
    loadComponent('howitworks', 'howitworks.html');
    loadComponent('reviews', 'reviews.html');
    loadComponent('upgrade', 'upgrade.html');
    loadComponent('footer', 'footer.html');
  </script>
</body>
</html>
