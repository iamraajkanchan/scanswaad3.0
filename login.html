<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Login - ScanSwaad</title>
  <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-[#0F172A] text-white flex items-center justify-center min-h-screen font-sans">

  <div class="bg-[#1E293B] p-8 rounded-2xl shadow-xl w-full max-w-md">
    <h2 class="text-3xl font-bold text-center mb-6 text-white">Login to ScanSwaad</h2>

    <!-- Email -->
    <div class="mb-4">
      <label class="block text-sm mb-1">Email</label>
      <input type="email" id="login-email" placeholder="Enter your email" class="w-full p-3 rounded-lg bg-gray-800 text-white border border-gray-600 focus:outline-none focus:ring-2 focus:ring-blue-500">
    </div>

    <!-- Password -->
    <div class="mb-2">
      <label class="block text-sm mb-1">Password</label>
      <input type="password" id="login-password" placeholder="Enter your password" class="w-full p-3 rounded-lg bg-gray-800 text-white border border-gray-600 focus:outline-none focus:ring-2 focus:ring-blue-500">
    </div>

    <!-- Forgot password -->
    <div class="text-right text-sm mb-4">
      <a href="#" class="text-blue-400 hover:underline">Forgot Password?</a>
    </div>

    <!-- Login Button -->
    <button onclick="loginUser()" class="w-full py-3 bg-gradient-to-r from-pink-500 to-blue-500 hover:from-pink-600 hover:to-blue-600 rounded-lg text-white font-bold transition-all duration-300">
      Login
    </button>

    <!-- Signup Link -->
    <p class="text-center text-sm mt-6 text-gray-300">
      Don't have an account?
      <a href="signup.html" class="text-pink-400 hover:underline font-medium">Create New Account</a>
    </p>
  </div>

  <!-- Firebase CDN -->
  <script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-app.js"></script>
  <script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-auth.js"></script>
  <script src="./firebase-config.js"></script>

  <!-- Login Script -->
  <script>
    const auth = firebase.auth();

    function loginUser() {
      const email = document.getElementById("login-email").value;
      const password = document.getElementById("login-password").value;

      auth.signInWithEmailAndPassword(email, password)
        .then((userCredential) => {
          alert("Login successful!");
          // Redirect to dashboard.html or customer view page
          window.location.href = "dashboard.html";
        })
        .catch((error) => {
          alert("Login failed: " + error.message);
        });
    }
  </script>
</body>
</html>
