<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Sign Up - ScanSwaad</title>
  <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-[#0F172A] text-white flex items-center justify-center min-h-screen">

  <div class="bg-[#1E293B] p-8 rounded-2xl shadow-2xl w-full max-w-3xl space-y-6">
    <h2 class="text-3xl font-bold text-center text-white mb-4">Create Your Restaurant Account</h2>

    <form id="signupForm" class="grid grid-cols-1 md:grid-cols-2 gap-4">
      <div>
        <label class="text-sm">First Name</label>
        <input type="text" id="firstName" placeholder="John" class="w-full p-3 bg-gray-800 border border-gray-600 rounded-lg text-white">
      </div>
      <div>
        <label class="text-sm">Last Name</label>
        <input type="text" id="lastName" placeholder="Doe" class="w-full p-3 bg-gray-800 border border-gray-600 rounded-lg text-white">
      </div>

      <div class="md:col-span-2">
        <label class="text-sm">Restaurant Name</label>
        <input type="text" id="restaurant" placeholder="ScanSwaad Restaurant" class="w-full p-3 bg-gray-800 border border-gray-600 rounded-lg text-white">
      </div>

      <div>
        <label class="text-sm">Country</label>
        <select id="country" class="w-full p-3 bg-gray-800 border border-gray-600 rounded-lg text-white">
          <option>India</option>
          <option>USA</option>
          <option>Canada</option>
          <option>UK</option>
        </select>
      </div>
      <div>
        <label class="text-sm">State / Province</label>
        <input type="text" id="state" placeholder="Maharashtra" class="w-full p-3 bg-gray-800 border border-gray-600 rounded-lg text-white">
      </div>

      <div>
        <label class="text-sm">City</label>
        <input type="text" id="city" placeholder="Mumbai" class="w-full p-3 bg-gray-800 border border-gray-600 rounded-lg text-white">
      </div>

      <div>
        <label class="text-sm">Phone Number</label>
        <input type="tel" id="phone" placeholder="+91 9876543210" class="w-full p-3 bg-gray-800 border border-gray-600 rounded-lg text-white">
      </div>

      <div class="md:col-span-2">
        <label class="text-sm">Full Address</label>
        <input type="text" id="address" placeholder="3/7 BMC Colony, Dr RP Road, Mulund West" class="w-full p-3 bg-gray-800 border border-gray-600 rounded-lg text-white">
      </div>

      <div>
        <label class="text-sm">Pin Code / Zip</label>
        <input type="text" id="pincode" placeholder="400080" class="w-full p-3 bg-gray-800 border border-gray-600 rounded-lg text-white">
      </div>

      <div>
        <label class="text-sm">Email</label>
        <input type="email" id="email" placeholder="you@example.com" class="w-full p-3 bg-gray-800 border border-gray-600 rounded-lg text-white">
      </div>

      <div>
        <label class="text-sm">Password</label>
        <input type="password" id="password" placeholder="••••••••" class="w-full p-3 bg-gray-800 border border-gray-600 rounded-lg text-white">
      </div>

      <div>
        <label class="text-sm">Confirm Password</label>
        <input type="password" id="confirmPassword" placeholder="••••••••" class="w-full p-3 bg-gray-800 border border-gray-600 rounded-lg text-white">
      </div>

      <div class="md:col-span-2">
        <button type="submit" class="w-full py-3 bg-gradient-to-r from-pink-500 to-blue-500 hover:from-pink-600 hover:to-blue-600 rounded-lg text-white font-bold">
          Create Account
        </button>
      </div>
    </form>

    <p class="text-center text-sm mt-4 text-gray-300">
      Already have an account?
      <a href="login.html" class="text-blue-400 hover:underline font-medium">Login</a>
    </p>
  </div>

  <!-- ✅ Firebase CDN Setup -->
  <script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-app.js"></script>
  <script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-auth.js"></script>
  <script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-firestore.js"></script>

  <!-- ✅ Firebase Config -->
  <script>
    const firebaseConfig = {
      apiKey: "AIzaSyAXSrdwDDe8Gg6DCjQ_bPSXu-Sh8whPYsE",
      authDomain: "scanswaad-28922.firebaseapp.com",
      projectId: "scanswaad-28922",
      storageBucket: "scanswaad-28922.appspot.com",
      messagingSenderId: "677748245747",
      appId: "1:677748245747:web:3b893e0d07812121aae386"
    };
    firebase.initializeApp(firebaseConfig);
    const auth = firebase.auth();
    const db = firebase.firestore();
  </script>

  <!-- ✅ Signup Script -->
  <script>
    document.getElementById("signupForm").addEventListener("submit", async function (e) {
      e.preventDefault();

      const get = (id) => document.getElementById(id).value;

      const firstName = get("firstName");
      const lastName = get("lastName");
      const restaurant = get("restaurant");
      const country = get("country");
      const state = get("state");
      const city = get("city");
      const phone = get("phone");
      const address = get("address");
      const pincode = get("pincode");
      const email = get("email");
      const password = get("password");
      const confirmPassword = get("confirmPassword");

      if (password !== confirmPassword) {
        alert("Passwords do not match!");
        return;
      }

      try {
        const userCred = await auth.createUserWithEmailAndPassword(email, password);
        const uid = userCred.user.uid;

        await db.collection("users").doc(uid).set({
          uid,
          firstName,
          lastName,
          restaurant,
          country,
          state,
          city,
          phone,
          address,
          pincode,
          email,
          createdAt: new Date()
        });

        alert("Account created successfully!");
        window.location.href = "dashboard.html";
      } catch (error) {
        alert("Signup failed: " + error.message);
      }
    });
  </script>
</body>
</html>
